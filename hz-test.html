<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Проверка прокрутки</title>
<!-- Временная страница: мешает ли невидимый переключатель (виброотклик на iOS) прокручивать список,
     если палец начинает движение на строке, и какая настройка это исправляет. После проверки удалить. -->
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px; background:#14161a; color:#e8e8ea; font:16px -apple-system, system-ui, sans-serif; }
  p { color:#9a9ca3; font-size:14px; margin:0 0 14px; line-height:1.4; }
  h2 { font-size:18px; font-weight:600; margin:22px 0 8px; }
  .row { position:relative; display:block; width:100%; text-align:left; margin-bottom:8px; padding:16px; border:1px solid #2c3038; border-radius:12px; background:#1f2228; color:#e8e8ea; font-size:15px; touch-action:pan-y; }
  .hz { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; opacity:.02; -webkit-appearance:none; appearance:none; background:transparent; border:0; border-radius:inherit; outline:none; -webkit-tap-highlight-color:transparent; }
  .b .hz { touch-action:pan-y; }
  .c .hz { touch-action:auto; }
  #log { position:sticky; bottom:0; padding:10px 0; background:#14161a; font-size:14px; color:#9a9ca3; }
</style>
</head>
<body>
<p>В каждом блоке поставьте палец на строку и ведите вверх-вниз. Запишите буквы блоков, где <b>список прокручивается</b>, и где при простом нажатии <b>есть виброотклик</b>.</p>
<div id="lists"></div>
<div id="log">Нажмите на строку</div>
<script>
  var blocks = [
    ["A", "как сейчас", true],
    ["B", "переключатель с pan-y", true],
    ["C", "переключатель с auto", true],
    ["D", "без переключателя", false]
  ];
  var html = "";
  blocks.forEach(function (b) {
    html += '<h2>' + b[0] + ' · ' + b[1] + '</h2><div class="' + b[0].toLowerCase() + '">';
    for (var i = 1; i <= 6; i++) html += '<button class="row">Строка ' + b[0] + i +
      (b[2] ? '<input type="checkbox" switch class="hz" tabindex="-1" aria-hidden="true">' : '') + '</button>';
    html += '</div>';
  });
  document.getElementById("lists").innerHTML = html;
  document.addEventListener("click", function (e) {
    var r = e.target.closest(".row");
    if (r) document.getElementById("log").textContent = "Нажата " + r.textContent;
  });
</script>
</body>
</html>
