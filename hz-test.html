<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Проверка виброотклика</title>
<!-- Временная страница: какой способ спрятать системный переключатель (виброотклик на iOS) не оставляет
     пятен в iOS 27 и при этом «тикает». После проверки удалить. -->
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:16px; background:#14161a; color:#e8e8ea; font:16px -apple-system, system-ui, sans-serif; }
  p { color:#9a9ca3; font-size:14px; margin:0 0 14px; line-height:1.4; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  button { position:relative; height:64px; border:1px solid #2c3038; border-radius:12px; background:#1f2228; color:#e8e8ea; font-size:15px; padding:0 8px; }
  button b { display:block; font-size:20px; }
  .hz { position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; border-radius:inherit; outline:none; -webkit-tap-highlight-color:transparent; }
  .a .hz { opacity:.02; }
  .b .hz { opacity:0; }
  .c .hz { opacity:.02; -webkit-appearance:none; appearance:none; }
  .d .hz { filter:opacity(0); }
  .e .hz { opacity:.02; -webkit-mask-image:linear-gradient(transparent, transparent); mask-image:linear-gradient(transparent, transparent); }
  .f .hz { opacity:.02; transform:scale(1); clip-path:inset(0 round 12px); }
  #log { margin-top:14px; font-size:14px; color:#9a9ca3; min-height:20px; }
</style>
</head>
<body>
<p>Нажмите на каждую кнопку. Запишите буквы тех, где <b>нет пятна</b> и где <b>есть виброотклик</b>.</p>
<div class="grid">
  <button class="a"><b>A</b>как сейчас<input type="checkbox" switch class="hz" tabindex="-1" aria-hidden="true"></button>
  <button class="b"><b>B</b>прозрачность 0<input type="checkbox" switch class="hz" tabindex="-1" aria-hidden="true"></button>
  <button class="c"><b>C</b>без вида<input type="checkbox" switch class="hz" tabindex="-1" aria-hidden="true"></button>
  <button class="d"><b>D</b>фильтр<input type="checkbox" switch class="hz" tabindex="-1" aria-hidden="true"></button>
  <button class="e"><b>E</b>маска<input type="checkbox" switch class="hz" tabindex="-1" aria-hidden="true"></button>
  <button class="f"><b>F</b>обрезка<input type="checkbox" switch class="hz" tabindex="-1" aria-hidden="true"></button>
</div>
<div id="log"></div>
<script>
  // нажатие всплывает до кнопки, как на основной странице: показываем, что кнопка сработала
  document.querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { document.getElementById("log").textContent = "Нажата " + b.querySelector("b").textContent; });
  });
</script>
</body>
</html>
