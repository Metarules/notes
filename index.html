<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- данные уходят только на сервер Apps Script; чужие скрипты, картинки и формы запрещены -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Бюджет">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Бюджет</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --field:#fff; --text:#1d1f23; --muted:#8a9099; --accent:#2563eb; --accent-soft:#e8efff; --line:#e5e7eb; --ok:#16a34a; --danger:#dc2626; --toast:#1d1f23;
      --toast-text:#fff; --shadow:rgba(0,0,0,.06); --warn:#92400e; --warn-bg:#fef3c7; color-scheme:light; }
    html[data-theme="dark"] { --bg:#111317; --card:#1b1e24; --field:#23272e; --text:#e8eaed; --muted:#9aa0a6; --accent:#3b82f6; --accent-soft:#1e2a44; --line:#2f343c; --ok:#4ade80;
      --danger:#f87171; --toast:#e8eaed; --toast-text:#111317; --shadow:rgba(0,0,0,.4); --warn:#fcd34d; --warn-bg:#3a2e12; color-scheme:dark; }
    /* значения, которые читает и скрипт (cssNum): высота строки в списке валют, длительность сдвига карточки */
    :root { --cur-row-h:52px; --swipe-ms:250ms; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { background:var(--bg); }
    body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
    button { font-family:inherit; cursor:pointer; }
    .wrap { max-width:480px; margin:0 auto; padding:calc(10px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); } /* снизу запас под плавающую панель браузера */
    .hidden { display:none !important; }
    .muted { color:var(--muted); font-size:13px; }
    /* загрузка */
    .loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 24px; text-align:center; background:var(--bg); z-index:10; }
    .spinner { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* строка под формой: слева переход в историю, справа тумблер темы и шестерёнка (настройки) */
    .navrow { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:40px; padding:0 2px; }
    .nav-right { display:flex; align-items:center; gap:2px; }
    .icon-btn { flex:0 0 auto; display:flex; align-items:center; justify-content:center; width:40px; height:40px; border:0; padding:0; background:transparent; color:var(--muted); }
    .icon-btn svg { width:22px; height:22px; }
    .hist-link { display:inline-flex; align-items:center; gap:5px; border:0; background:transparent; color:var(--muted); font-size:16px; padding:9px 8px 9px 4px; }
    .hist-link .chev { font-size:20px; line-height:1; margin-left:-1px; }
    .theme-switch { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; position:relative; flex:0 0 auto; width:58px; height:32px; border:0; border-radius:999px; padding:0; background:var(--line); }
    .theme-switch .ico { position:absolute; top:7px; width:18px; height:18px; color:var(--muted); }
    .theme-switch .ico.sun { left:7px; }
    .theme-switch .ico.moon { right:7px; }
    .theme-switch .knob { position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:var(--card); box-shadow:0 1px 3px rgba(0,0,0,.3);
      display:flex; align-items:center; justify-content:center; color:var(--text); transition:transform .2s ease; }
    .theme-switch .knob svg { width:16px; height:16px; }
    .theme-switch[aria-checked="true"] .knob { transform:translateX(26px); }
    /* шапка истории и режима изменения */
    .editbar { display:flex; align-items:center; gap:6px; margin-bottom:14px; min-height:42px; }
    .editbar .back { border:0; background:transparent; color:var(--accent); font-size:22px; padding:4px 10px 4px 2px; }
    .editbar .title { font-size:16px; font-weight:600; }
    .editbar .date { color:var(--muted); font-weight:400; }
    .card { background:var(--card); border-radius:14px; padding:12px; margin-bottom:10px; box-shadow:0 1px 2px var(--shadow); }
    /* поле суммы: знак | сумма | валюта */
    .amount-field { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:12px; background:var(--field); overflow:hidden; }
    .amount-field .sign { flex:0 0 52px; border:0; border-right:1px solid var(--line); background:transparent; color:var(--text); font-size:22px; }
    .amount-field.pos .sign, .amount-field.pos input { color:var(--ok); }
    .amount-field input { flex:1; min-width:0; border:0; outline:none; background:transparent; color:var(--text); font-size:22px; padding:12px; }
    .amount-field .clear { flex:0 0 40px; border:0; background:transparent; color:var(--muted); font-size:18px; padding:0; }
    #clearAmt.hidden { display:block !important; visibility:hidden; }
    /* валюта: свой крупный выбор вместо системного списка (его размер в iOS не настроить); select — только хранит значение */
    .amount-field select { display:none; }
    .amount-field .cur-btn { flex:0 0 86px; border:0; border-left:1px solid var(--line); background:transparent; color:var(--text); font-size:17px; padding:0 8px; }
    .amount-field .cur-btn:disabled { color:var(--muted); }
    .amount-field .cur-btn { display:flex; align-items:center; justify-content:center; gap:4px; }
    .amount-field .cur-btn .caret { width:18px; height:18px; flex:0 0 auto; color:var(--muted); }
    #view-add .card { position:relative; margin-bottom:6px; }
    /* выпадающий список валют, как системное меню iOS: столбик под кнопкой, у текущей — галочка слева, без подсветки; серый фон только под пальцем */
    .cur-panel { position:absolute; right:12px; width:150px; z-index:5; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0;
      background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 8px 24px rgba(0,0,0,.25); }
    .cur-panel button { display:flex; align-items:center; gap:8px; width:100%; min-height:var(--cur-row-h); padding:6px 14px 6px 12px; border:0; background:transparent; color:var(--text); text-align:left; }
    .cur-panel button + button { border-top:1px solid var(--line); }
    .cur-panel .code { flex:1; font-size:20px; font-weight:600; }
    .cur-panel .check { flex:0 0 20px; color:var(--text); font-size:18px; font-weight:600; text-align:center; }
    .cur-panel button:active { background:var(--line); }
    /* сетка категорий */
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:10px; }
    .chip { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:var(--chip-h, 60px); padding:4px; border:1px solid var(--line); border-radius:12px;
      background:var(--field); color:var(--text); }
    .chip .emo { font-size:22px; line-height:1; }
    .chip .name { font-size:13px; line-height:1.2; text-align:center; }
    .chip.on { border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
    .btn { width:100%; padding:13px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:17px; margin-top:10px; transition:background .15s, color .15s; }
    /* пока сумма и категория не введены — кнопка серая и не нажимается; во время отправки — синяя с индикатором */
    .btn:disabled { background:var(--line); color:var(--muted); cursor:default; }
    .btn.saving:disabled { background:var(--accent); color:#fff; opacity:.8; }
    .link { display:block; width:100%; margin-top:6px; padding:8px; border:0; background:transparent; color:var(--muted); font-size:14px; }
    /* адаптивность: широкий экран (iPad, телефон боком) — шире колонка и 4 категории в ряд;
       самые узкие (320 точек) — шрифт мельче, чтобы длинные названия не переносились.
       Высоту кнопок категорий подбирает fitLayout() под высоту экрана. */
    @media (min-width: 560px) { .wrap { max-width:600px; } .grid { grid-template-columns:repeat(4, 1fr); } }
    /* компактные кнопки категорий для коротких экранов: эмодзи слева от подписи */
    .grid.compact .chip { flex-direction:row; gap:5px; padding:4px 6px; }
    .grid.compact .chip .emo { font-size:16px; }
    .grid.compact .chip .name { font-size:12px; text-align:left; }
    @media (max-width: 340px) { .wrap { padding-left:10px; padding-right:10px; } .chip .name { font-size:11px; } .amount-field input { font-size:20px; } }
    /* история: слева «Сегодня» / «Вчера» / день недели, справа дата */
    .day { display:flex; justify-content:space-between; align-items:baseline; gap:10px; color:var(--muted); font-size:13px; font-weight:600; margin:24px 4px 10px; }
    .day .dd { font-weight:400; }
    /* переключатели: Операции | Статистика и вид периода */
    .seg { display:flex; background:var(--line); border-radius:10px; padding:3px; margin-bottom:12px; }
    .seg button { flex:1; min-width:0; border:0; background:transparent; padding:8px 4px; border-radius:8px; font-size:15px; color:var(--muted); white-space:nowrap; }
    .seg button.on { background:var(--card); color:var(--text); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.18); }
    .seg.kinds button { font-size:14px; padding:7px 2px; }
    .pnav { display:flex; align-items:center; justify-content:space-between; margin:0 0 10px; }
    .pnav button { border:0; background:transparent; color:var(--accent); font-size:30px; line-height:1; width:48px; height:40px; }
    .pnav button:disabled { color:var(--line); }
    .pnav .lbl { font-size:16px; font-weight:600; text-align:center; }
    .pdates { display:flex; gap:10px; margin:0 0 12px; }
    .pdates label { flex:1; min-width:0; display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
    /* Safari на iPhone задаёт полям дат собственную минимальную ширину — снимаем её, иначе поля вылезают за экран */
    .pdates input { display:block; box-sizing:border-box; width:100%; min-width:0; max-width:100%; -webkit-appearance:none; appearance:none;
      font-size:16px; line-height:22px; min-height:42px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:var(--field); color:var(--text); text-align:left; }
    .pdates input::-webkit-date-and-time-value { text-align:left; margin:0; }
    /* итог: траты и начисления рядом, одинаковым размером */
    .stat-sum { display:flex; flex-wrap:wrap; padding:14px 0 0; }
    .stat-sum > div { flex:1; min-width:0; padding:0 14px 14px; }
    .stat-sum > div + div { border-left:1px solid var(--line); }
    .stat-sum > .bal { flex-basis:100%; display:flex; justify-content:space-between; align-items:baseline; border-left:0; border-top:1px solid var(--line); padding-top:12px; }
    .stat-sum .bal .cap { font-size:15px; color:var(--text); }
    .stat-sum .val.plus { color:var(--ok); }
    .stat-sum .val.minus { color:var(--danger); }
    .stat-sum .cap { color:var(--muted); font-size:13px; }
    .stat-sum .val { font-size:22px; font-weight:700; margin-top:3px; white-space:nowrap; }
    .sect { color:var(--muted); font-size:13px; font-weight:600; margin:20px 4px 8px; }
    .catrow { padding:9px 2px; }
    .catrow + .catrow { border-top:1px solid var(--line); }
    .catrow .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:15px; }
    .catrow .nm { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .catrow .amt { font-weight:600; white-space:nowrap; }
    .catrow .pct { color:var(--muted); font-weight:400; font-size:13px; margin-left:6px; }
    .bar { height:6px; background:var(--line); border-radius:3px; margin-top:7px; overflow:hidden; }
    .bar i { display:block; height:100%; background:var(--accent); border-radius:3px; }
    .bar.inc i { background:var(--ok); }
    .hist-more { display:flex; flex-direction:column; align-items:center; gap:6px; min-height:64px; padding:16px 0 24px; font-size:14px; text-align:center; }
    .diag { position:fixed; inset:12px; z-index:50; overflow:auto; padding:12px; border-radius:14px; background:var(--card); color:var(--text);
      border:1px solid var(--line); box-shadow:0 8px 24px rgba(0,0,0,.3); font:12px/1.45 ui-monospace, Menlo, monospace; white-space:pre-wrap; }
    .day:first-child { margin-top:0; }
    /* строка истории: карточка сдвигается свайпом влево и открывает кнопку «Удалить» */
    .row { position:relative; margin-bottom:10px; border-radius:14px; overflow:hidden; }
    .row .card { margin-bottom:0; }
    .tx { position:relative; z-index:1; display:flex; align-items:center; gap:8px; padding:14px 16px; touch-action:pan-y; transition:transform var(--swipe-ms) ease; will-change:transform; }
    .swipe-del { position:absolute; top:0; right:0; bottom:0; width:96px; padding-left:8px; border:0; background:var(--danger); color:#fff; font-size:15px; visibility:hidden; }
    .row.swiping .swipe-del { visibility:visible; }
    .row.swiping .tx { border-radius:0; }
    .tx-main { flex:1; min-width:0; }
    .tx-sub { color:var(--muted); font-size:13px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .amount { font-weight:600; }
    .amount.pos { color:var(--ok); }
    .row.busy { pointer-events:none; }
    .row.busy .tx { opacity:.55; }
    .mini-spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;
      vertical-align:middle; }
    /* уведомление внизу, поверх содержимого */
    .toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%, -20px); max-width:calc(100% - 28px); padding:11px 16px; border-radius:12px;
      background:var(--toast); color:var(--toast-text); font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; }
    .toast.show { opacity:1; transform:translate(-50%, 0); }
    .toast.err { background:var(--danger); color:#fff; }
    /* пока данные грузятся фоном — индикаторы на месте категорий, валюты и истории */
    .spinner.sm { width:22px; height:22px; border-width:2px; }
    /* нет связи с сервером — плашка над формой, держится, пока связь не вернётся */
    .netbar { display:flex; align-items:center; gap:12px; margin-bottom:12px; padding:10px 12px 10px 14px; border-radius:12px; background:var(--warn-bg); color:var(--warn); }
    .netbar .nb-text { flex:1; min-width:0; line-height:1.3; }
    .netbar .nb-title { display:block; font-size:15px; font-weight:600; }
    .netbar .nb-sub { display:block; font-size:13px; opacity:.85; margin-top:1px; }
    /* кнопка — отдельный «пилюлей» с рамкой, чтобы не читалась как продолжение текста */
    .netbar button { flex:0 0 auto; border:1px solid currentColor; border-radius:999px; background:transparent; color:inherit; font-weight:600; font-size:14px; padding:6px 14px; white-space:nowrap; }
    .netbar button:disabled { opacity:.5; }
    /* траты из очереди на телефоне — в истории сверху, приглушённо */
    .row.queued .tx { opacity:.75; }
    .row.queued .tx-sub .q { color:var(--warn); }
    .row.queued .tx-sub .q.err { color:var(--danger); }
    .row.queued .tx-sub .q.sending { color:var(--accent); }
    .row.queued .tx-sub .q.waiting { color:var(--muted); }
    .row.queued .tx-status { margin-top:3px; white-space:normal; }
    .q-spin { display:inline-block; width:10px; height:10px; border:1.5px solid currentColor; border-top-color:transparent; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-1px; margin-right:4px; }
    .pending { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:120px; text-align:center; }
    .pending.tall { min-height:160px; }
    .amount-field select.loading { color:var(--muted); }
    /* экран «Настройки»: строки «название — значение» в карточках */
    #view-settings .sect:first-child { margin-top:0; }
    .setlist { padding:0 14px; }
    .setrow { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; padding:8px 0; font-size:16px; color:var(--text); }
    .setrow + .setrow { border-top:1px solid var(--line); }
    .setrow .val { color:var(--muted); }
    .setrow .chev { color:var(--muted); font-size:20px; line-height:1; }
    button.setrow { width:100%; border:0; background:transparent; text-align:left; font-family:inherit; }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div class="spinner" id="spinner"></div>
    <div id="loaderText" class="muted"></div>
    <button id="retryBtn" class="link hidden" style="width:auto" onclick="load()">Повторить</button>
  </div>

  <div id="app" class="wrap hidden">
    <div id="netBar" class="netbar hidden" role="status">
      <div class="nb-text"><span class="nb-title">Нет связи</span><span id="netText" class="nb-sub"></span></div>
      <button id="netRetry" onclick="load()">Повторить</button>
    </div>
    <div id="histBar" class="editbar hidden">
      <button class="back" onclick="showTab('add')" aria-label="Назад к вводу">←</button>
      <span class="title">История</span>
    </div>
    <div id="setBar" class="editbar hidden">
      <button class="back" onclick="showTab('add')" aria-label="Назад к вводу">←</button>
      <span class="title">Настройки</span>
    </div>
    <div id="editBar" class="editbar hidden">
      <button class="back" onclick="cancelEdit()" aria-label="Назад">←</button>
      <span class="title">Изменение операции <span id="editDate" class="date"></span></span>
    </div>

    <section id="view-add">
      <div class="card">
        <div id="amountField" class="amount-field">
          <button id="signBtn" class="sign" onclick="toggleSign()" aria-label="Сменить знак">−</button>
          <input id="amount" inputmode="decimal" placeholder="0" autocomplete="off">
          <button id="clearAmt" class="clear hidden" onclick="clearAmount()" aria-label="Стереть сумму">✕</button>
          <select id="currency" aria-hidden="true" tabindex="-1"></select>
          <button id="curBtn" class="cur-btn" onclick="toggleCurPanel()" aria-label="Валюта" aria-haspopup="true" aria-expanded="false">…</button>
        </div>
        <div id="curPanel" class="cur-panel hidden" role="menu" aria-label="Выбор валюты"></div>
        <div id="catGrid" class="grid"></div>
        <button class="btn" id="saveBtn" onclick="save()" disabled>Сохранить</button>
      </div>
      <div id="navRow" class="navrow">
        <button id="histLink" class="hist-link" onclick="showTab('history')">
          История<span class="chev" aria-hidden="true">›</span>
        </button>
        <div class="nav-right">
          <button id="themeSwitch" class="theme-switch" role="switch" aria-checked="false" aria-label="Тёмная тема" onclick="toggleTheme()">
            <svg class="ico sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="ico moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
            <span class="knob" id="themeKnob" aria-hidden="true"></span>
          </button>
          <button id="settingsBtn" class="icon-btn" onclick="showTab('settings')" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
    </section>

        <div class="setrow"><span>Версия страницы</span><span class="val" id="verPage"></span></div>
        <div class="setrow"><span>Версия сервера</span><span class="val" id="verServer"></span></div>

  <div id="toast" class="toast"></div>

  <script>
    // prefill — данные траты из ссылки шортката, СМС или вставленного текста: { merchant }
    // loaded — справочники (категории, валюты, магазины) уже есть: из кэша на устройстве или с сервера
    // touched — пользователь сам менял форму: фоновая загрузка больше не перезаписывает его ввод
    // Номер релиза страницы = число коммитов index.html на GitHub, включая тот, где он записан
    // (git rev-list --count HEAD -- index.html): +1 при каждом изменении страницы. Виден внизу формы
    // рядом с номером сервера — так понятно, что телефон открыл свежую страницу, а не старую из кэша.
    var PAGE_VERSION = 38;

    var state = { categories: [], currencies: [], merchants: {}, recent: [], prefill: null, editing: null, savedNew: null, sign: -1, categoryId: "", todayKey: "",
      loaded: false, loadError: "", offline: false, touched: false, smsText: "", smsFailShown: false };

    function el(id) { return document.getElementById(id); }
    // число из CSS-переменной ("52px", "250ms" → 52, 250): одно значение и для стилей, и для кода
    function cssNum(name, fallback) {
      var v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name));
      return isFinite(v) ? v : fallback;
    }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function store(key, value) {
      try {
        if (value === undefined) return localStorage.getItem(key);
        if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
      } catch (e) { return null; }
    }
    // текст СМС на время жизни вкладки: обновление страницы не теряет подставленную трату
    function session(key, value) {
      try {
        if (value === undefined) return sessionStorage.getItem(key);
        if (value === null) sessionStorage.removeItem(key); else sessionStorage.setItem(key, value);
      } catch (e) { return null; }
    }

    // ---------- уведомление ----------
    // isError — красное уведомление (ошибка); ms — сколько показывать, если нужно дольше обычного
    // сколько держится уведомление: обычное, «Сохранено», подсказка или предупреждение, ошибка
    var TOAST_MS = 2500, TOAST_SHORT_MS = 2000, TOAST_LONG_MS = 4000, TOAST_ERROR_MS = 5000;
    function toast(text, isError, ms) {
      var t = el("toast");
      t.textContent = text;
      t.className = "toast show" + (isError ? " err" : "");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { t.className = "toast" + (isError ? " err" : ""); }, ms || (isError ? TOAST_ERROR_MS : TOAST_MS));
    }

    // любое касание страницы или нажатие клавиши убирает уведомление: пользователь уже приступил к делу.
    // Новое уведомление от этого же касания (например, ошибка при сохранении) появится уже после.
    function hideToast() {
      clearTimeout(toast.timer);
      el("toast").classList.remove("show");
    }
    document.addEventListener("pointerdown", hideToast, true);
    document.addEventListener("keydown", hideToast, true);

    var saving = false;
    function setSaving(on) {
      var b = el("saveBtn");
      saving = !!on;
      b.classList.toggle("saving", saving);
      b.innerHTML = on ? '<span class="mini-spinner"></span>' : "Сохранить";
      updateSaveBtn();
    }
    // «Сохранить» доступна, только когда есть сумма, выбрана категория и загружены справочники
    function amountValue() {
      var raw = el("amount").value.trim().replace(/^[-+]/, "");
      var n = raw ? parseNumber(raw) : NaN; // "1 234,50", "1,234.56" и т.п. — так же, как в разборе СМС
      return isFinite(n) && n !== 0 ? Math.abs(n) : 0;
    }
    function formReady() { return state.loaded && !!state.categoryId && amountValue() > 0; }
    function updateSaveBtn() { el("saveBtn").disabled = saving || !formReady(); }

    // ---------- связь с сервером (Apps Script) ----------
    // Адрес сервера и ключ приходят в ссылке от шортката (после "#") и хранятся только на этом устройстве.
    var API = {
      apiGetInitData: function () { return { fn: "init" }; },
      apiGetRecent: function () { return { fn: "recent" }; },
      apiGetOlder: function (before) { return { fn: "recent", before: before }; },
      apiGetStats: function (from, to) { return { fn: "stats", from: from, to: to }; },
      apiAddTransaction: function (form) { return { fn: "add", form: form }; },
      apiAddMany: function (forms) { return { fn: "addMany", forms: forms }; },
      apiUpdateTransaction: function (row, expected, form) { return { fn: "update", row: row, expected: expected, form: form }; },
      apiDeleteTransaction: function (row, expected) { return { fn: "delete", row: row, expected: expected }; },
      apiDeleteById: function (id) { return { fn: "deleteById", id: id }; }
    };

    function isApiUrl(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(u || "")); }
    function hasAccess() { return isApiUrl(store("api")) && !!store("token"); }

    var TIMEOUT_MS = 30000; // дольше ответа не ждём: на плохой связи иначе индикатор крутится бесконечно

    // opts.keepalive — запрос доходит до сервера, даже если форму закрыли сразу после «Сохранить»
    function call(fn, args, onOk, onErr, opts) {
      function fail(msg, kind) {
        if (onErr) onErr(msg, kind || "server"); else toast(msg, true);
        setSaving(false);
      }
      var api = store("api"), token = store("token");
      if (!isApiUrl(api) || !token) { noAccess(MSG_OPEN_VIA_SHORTCUT); return; }
      var body = API[fn].apply(null, args || []);
      body.action = "page";
      body.token = token;
      var ctrl = typeof AbortController === "function" ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;
      // text/plain — «простой» запрос без предварительной проверки CORS, Apps Script его принимает
      fetch(api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow", credentials: "omit", referrerPolicy: "no-referrer", keepalive: !!(opts && opts.keepalive), signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) {
          // Google при сбое (квота, ошибка скрипта) отвечает HTML-страницей, а не JSON
          return r.text().then(function (text) {
            try { return JSON.parse(text); } catch (e) { throw { server: "Сервер ответил ошибкой" + (r.status !== 200 ? " (HTTP " + r.status + ")" : "") + " — попробуйте позже" }; }
          });
        })
        .then(function (res) {
          clearTimeout(timer);
          setOnline(true); // сервер ответил — связь есть
          if (res && res.ok) {
            // ошибка в обработчике — не «нет связи»: выпускаем её отдельно, мимо catch ниже
            try { onOk(res.result, res); } catch (err) { setTimeout(function () { throw err; }); }
            return;
          }
          if (res && res.auth === false) {
            store("token", null); // ключ не подошёл — забываем его и кэш данных
            store("init", null);
            noAccess("Нет доступа. " + MSG_OPEN_VIA_SHORTCUT);
            return;
          }
          fail((res && res.error) || "Ошибка сервера");
        })
        .catch(function (e) {
          clearTimeout(timer);
          if (e && e.server) { setOnline(true); fail(e.server); return; } // ответила страница ошибки Google — связь есть
          setOnline(false);
          if (e && e.name === "AbortError") fail("Сервер не ответил — попробуйте ещё раз", "network");
          else fail("Нет связи с сервером", "network");
        });
    }

    // случайный id новой траты
    function newId() {
      try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
    }
    // форму поменяли; byUser — изменил сам пользователь (фоновая загрузка его ввод больше не перезаписывает)
    function formChanged(byUser) {
      if (byUser) state.touched = true;
    }

    // тексты, которые встречаются в нескольких местах
    // номера релизов на экране «Настройки»; номер сервера приходит в init (serverVersion), до ответа — из кэша или «—»
    function renderVersion() {
      el("verPage").textContent = PAGE_VERSION;
      el("verServer").textContent = state.serverVersion || "—";
    }

    var MSG_OPEN_VIA_SHORTCUT = "Откройте форму через шорткат «Бюджет»";
    var MSG_DICT_LOADING = "Справочники ещё загружаются — попробуйте через пару секунд";
    var MSG_STATS_WAIT_NET = "Статистика загрузится, когда будет связь";

    function noAccess(text) {
      el("app").classList.add("hidden");
      el("loader").classList.remove("hidden");
      el("spinner").classList.add("hidden");
      el("retryBtn").classList.add("hidden");
      el("loaderText").textContent = text;
    }

    // ---------- разбор СМС / уведомления банка ----------
    // Разбор только здесь, на странице: сервер получает готовые сумму, валюту и магазин.

    // число из строки: "1 234,50", "1.234,50", "1,234.50", "-350" и т.п.
    function parseNumber(raw) {
      var s = String(raw).replace(/[\s  ']/g, "");
      var lastDot = s.lastIndexOf("."), lastComma = s.lastIndexOf(",");
      if (lastDot > -1 && lastComma > -1) {
        if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
        else s = s.replace(/,/g, "");
      } else if (lastComma > -1) {
        var commas = (s.match(/,/g) || []).length;
        if (commas > 1 || s.length - lastComma - 1 === 3) s = s.replace(/,/g, "");
        else s = s.replace(",", ".");
      } else if (lastDot > -1) {
        var dots = (s.match(/\./g) || []).length;
        if (dots > 1 || s.length - lastDot - 1 === 3) s = s.replace(/\./g, "");
      }
      return Number(s);
    }

    // Те же правила, что normalizeMerchant_ на сервере: по этим ключам сервер присылает категории магазинов.
    var MERCHANT_MAX = 100; // длина названия; сервер присылает своё значение в init (limits)
    function normalizeMerchant(name) {
      return String(name || "").replace(/\s+/g, " ").trim().replace(/^[=+\-@'\s]+/, "").slice(0, MERCHANT_MAX).toUpperCase();
    }

    // категория, которую магазин получил в прошлый раз (только подсказка)
    function merchantCategory(merchant) {
      var key = normalizeMerchant(merchant);
      return key && Object.prototype.hasOwnProperty.call(state.merchants, key) ? String(state.merchants[key]) : "";
    }

    function extractMerchant(t, amountText) {
      var patterns = [
        /(?:trgovac|prodajno mesto|mesto|kod|merchant|магазин|место)\s*[:\-]?\s*([^\n,;]{2,60})/i,
        /\b(?:at|u|в)\s+([A-ZА-ЯЁ0-9][^\n,;]{1,60})/
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = t.match(patterns[i]);
        if (m && m[1] && m[1].indexOf(amountText) === -1) return normalizeMerchant(m[1]);
      }
      return "";
    }

    // похоже ли на сообщение банка — по словам из его СМС (Placeno kart.br. … / Raspolozivo: …)
    function looksLikeBankText(text) {
      return /\bpla[cć]eno\b|kart\.?\s*br|raspolo/i.test(String(text || ""));
    }

    // { amount, currencyId, merchant } или null. Формат банка разбирается сразу,
    // общий формат («500 RSD …») — только когда известен список валют.
    function parseBankText(text) {
      var t = String(text || "").replace(/ /g, " ");

      // пример (выдуманный): Placeno kart.br. 123456_0000 / MP001 PRODAVNICA BG / Beograd RS / RSD 1,234.56 / Raspolozivo: RSD 10,000.00
      var parts = t.split("/").map(function (s) { return s.trim(); }).filter(Boolean);
      if (/^plac[ae]no\b/i.test(parts[0] || "") && parts.length >= 4) {
        for (var i = 2; i < parts.length; i++) {
          if (/^raspolo/i.test(parts[i])) break;
          var am = parts[i].match(/^([A-Za-z]{3})\s*([\d.,\s]+)$/) || parts[i].match(/^([\d.,\s]+)\s*([A-Za-z]{3})$/);
          if (!am) continue;
          var codeFirst = /^[A-Za-z]/.test(am[1]);
          var value = parseNumber(codeFirst ? am[2] : am[1]);
          if (isFinite(value) && value !== 0)
            return { amount: -Math.abs(value), currencyId: (codeFirst ? am[1] : am[2]).toUpperCase(), merchant: normalizeMerchant(parts[1]) };
        }
      }
      var codes = state.currencies.map(function (c) { return String(c).replace(/[^A-Za-z]/g, ""); }).filter(Boolean);
      if (!codes.length) return null;
      var codeRe = codes.join("|");
      var num = "(\\d{1,3}(?:[ .,']\\d{3})+(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)";

      // остаток на счёте («Raspoloživo: RSD …») — никогда не сумма траты: дальше его не смотрим
      t = t.replace(/raspolo[žz]ivo[\s\S]*$/i, "");
      var amountStr = "", currencyId = "", matched = "";
      // перед суммой — начало строки или не цифра (вместо lookbehind, которого нет в старом Safari)
      var m = t.match(new RegExp("(?:^|[^\\d.,])" + num + "\\s*(" + codeRe + ")\\b", "i"));
      if (m) { amountStr = m[1]; currencyId = m[2]; matched = m[0]; }
      else {
        m = t.match(new RegExp("\\b(" + codeRe + ")\\s*" + num, "i"));
        if (m) { currencyId = m[1]; amountStr = m[2]; matched = m[0]; }
      }
      if (!m) return null;

      var amount = Math.abs(parseNumber(amountStr));
      if (!isFinite(amount) || amount === 0) return null;
      // поступления — со знаком плюс, всё остальное — расход
      if (!/(uplat|priliv|odobren|povra[ćt]|refund|\bcredited\b|зачисл|пополн|возврат|поступ)/i.test(t)) amount = -amount;
      return { amount: amount, currencyId: currencyId.toUpperCase(), merchant: extractMerchant(t, matched.trim()) };
    }

    // ---------- тема ----------
    function currentTheme() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
    // тумблер: в ползунке — значок текущей темы (слева солнце, справа луна)
    function updateThemeBtn() {
      var dark = currentTheme() === "dark";
      el("themeSwitch").setAttribute("aria-checked", dark ? "true" : "false");
      el("themeKnob").innerHTML = (dark ? document.querySelector("#themeSwitch .moon") : document.querySelector("#themeSwitch .sun")).outerHTML.replace(/class="[^"]*"/, "");
    }
    // Тема: тумблер на форме — светлая/тёмная, выбор запоминается на этом устройстве.
    // Пока тумблер не трогали, тема как в системе («auto» — отсутствие выбора) и меняется вместе с ней.
    var darkQuery = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    function themeMode() { var t = store("theme"); return t === "dark" || t === "light" ? t : "auto"; }
    function applyTheme() {
      var m = themeMode();
      var t = m === "auto" ? (darkQuery && darkQuery.matches ? "dark" : "light") : m;
      document.documentElement.setAttribute("data-theme", t);
      updateThemeBtn();
    }
    function setTheme(m) { store("theme", m === "auto" ? null : m); applyTheme(); }
    // выбора нет, а система сменила тему (например, вечером) — меняемся вместе с ней
    if (darkQuery) {
      var onSystemTheme = function () { if (themeMode() === "auto") applyTheme(); };
      if (darkQuery.addEventListener) darkQuery.addEventListener("change", onSystemTheme);
      else if (darkQuery.addListener) darkQuery.addListener(onSystemTheme);
    }

    // Диагностика размеров окна (для подгонки кнопок под экран) — пункт на экране «Настройки».
    // Меряет форму ввода, поэтому сначала возвращаемся на неё и показываем данные поверх.
    function openDiag() {
      showTab("add");
      requestAnimationFrame(function () { requestAnimationFrame(showDiag); });
    }
    function showDiag() {
      function probe(css) {
        var d = document.createElement("div");
        d.style.cssText = "position:fixed;top:0;left:0;width:1px;visibility:hidden;pointer-events:none;" + css;
        document.body.appendChild(d);
        var v = Math.round(d.getBoundingClientRect().height); d.remove(); return v;
      }
      var anchor = el("navRow").offsetParent ? el("navRow") : el("saveBtn");
      var lines = [
        "Версии: страница " + PAGE_VERSION + ", сервер " + (state.serverVersion || "—"),
        "Размеры окна (для настройки формы)",
        "ih " + window.innerHeight + " · iw " + window.innerWidth + " · screen " + screen.width + "×" + screen.height + " · dpr " + window.devicePixelRatio,
        "svh " + probe("height:100svh") + " · lvh " + probe("height:100lvh") + " · dvh " + probe("height:100dvh") +
          " · safe↓ " + probe("height:0;padding-bottom:env(safe-area-inset-bottom)") + " · safe↑ " + probe("height:0;padding-top:env(safe-area-inset-top)"),
        "низ «Истории» " + Math.round(anchor.getBoundingClientRect().bottom) + " · запас под панель " + fitReserve() + " · кнопки " +
          document.documentElement.style.getPropertyValue("--chip-h") + (el("catGrid").classList.contains("compact") ? " компакт" : ""),
        "", "Журнал с момента открытия:"
      ].concat(fitLog, ["", "Нажмите, чтобы закрыть"]);
      var d = document.createElement("div");
      d.className = "diag"; d.textContent = lines.join("\n");
      d.onclick = function () { d.remove(); };
      document.body.appendChild(d);
    }
    function toggleTheme() { setTheme(currentTheme() === "dark" ? "light" : "dark"); }

    // ---------- экраны: ввод (основной) и история (переход — под «Сохранить», назад — стрелкой в шапке) ----------
    // ---------- статистика ----------
    // Вид промежутка: p — отчётный («С 20-го»), m — календарный месяц, y — год, c — свои даты.
    // offset — сколько промежутков назад (0 — текущий); сравнить с прошлым — стрелкой ‹.
    var stats = { pane: "ops", kind: "p", offset: 0, cache: {}, seq: 0 };
    var MON_GEN = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
    var MON_NOM = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

    // телефон снова в сети — сразу пробуем загрузить; пропала сеть — сразу показываем плашку

    // изменить или удалить уже записанную операцию можно только со связью (очередь — только для новых)

    // ---------- удаление: свайп влево открывает кнопку «Удалить» ----------
    var REVEAL = 88; // на сколько уезжает карточка
    var SWIPE_START_PX = 8; // сдвиг пальца, после которого понятно: это свайп или прокрутка

    function setX(row, x, animate) {

      c.style.transition = animate ? "" : "none";

    }, true);
    var list = el("historyList");

      var row = e.target.closest(".row");

    });

        else toast(sendingIds.indexOf(qid) > -1 ? "Отправляется…" : state.offline ? "Отправится, когда будет связь" : "В очереди на отправку");

    });
    // Карточка исчезает сразу, запрос уходит фоном. Можно удалять несколько подряд, не дожидаясь ответов:
    // сервер находит операцию по дате, сумме и валюте, даже если её строка уже сдвинулась.
    // Свежая история с сервера рисуется, только когда ответили на все удаления (иначе вернулись бы
    // ещё не удалённые карточки). Если какое-то удаление не прошло, карточка возвращается, а после всех
    // ответов история перечитывается с сервера.
    var pendingDeletes = 0, deleteFailed = false;
    function byDateDesc(a, b) { return (b.sortKey - a.sortKey) || (b.row - a.row); }

    // ---------- подгрузка старых операций при прокрутке истории ----------
    // state.recent — всё, что показано: первая страница от сервера и подгруженные старые.
    // Сервер в ответах присылает только первую страницу — старые подгруженные сохраняем (withOlder).
    // HIST_PAGE и SEND_BATCH сервер присылает в init (limits); здесь — значения до первого ответа
    var HIST_PAGE = 50;
    var HIST_PRELOAD_SCREENS = 2.5; // до конца списка меньше стольких экранов — грузим следующую страницу
    var HIST_REDRAW_RETRY_MS = 400; // пока открыт свайп или идёт удаление — пробуем перерисовать через столько
    var HIST_ONLINE_DELAY_MS = 500; // связь вернулась — подгрузку истории пробуем чуть позже
    var hist = { loading: false, done: false, failed: false, next: 0 }; // next — с какой строки таблицы грузить дальше
    function opKey(x) { return x.id || [x.date, x.amount, x.currencyId, x.categoryId].join("|"); }
    function minRow(list) { return list.reduce(function (m, x) { return Math.min(m, Number(x.row) || Infinity); }, Infinity); }
    // сервер вставил строку row (операция встала на место по дате): у строк ниже номера выросли на один
    function shiftRows(row) {

      if (hist.next && row <= hist.next) hist.next++;

          if (!canRedrawHistory() || pendingDeletes > 0) { setTimeout(apply, HIST_REDRAW_RETRY_MS); return; }

      });
    }
    function retryOlder() { hist.failed = false; loadOlder(); }
    // низ списка: индикатор, ошибка с «Повторить» или «Это все операции»
    function renderMore() {
      var m = el("histMore");
      if (!state.loaded || !(state.recent || []).length) { m.innerHTML = ""; return; }
      if (hist.loading) m.innerHTML = '<span class="spinner sm"></span>';
      else if (hist.failed) m.innerHTML = '<span class="muted">Старые операции не загрузились</span><button class="link" style="width:auto;margin:0" onclick="retryOlder()">Повторить</button>';
      else if (hist.done) m.innerHTML = '<span class="muted">Это все операции</span>';
      else if (state.offline || navigator.onLine === false) m.innerHTML = '<span class="muted">Старые операции загрузятся, когда будет связь</span>';
      else m.innerHTML = "";
    }
    // до конца списка осталось меньше HIST_PRELOAD_SCREENS экранов — грузим следующую страницу
    function checkMore() {
      if (!historyVisible()) return;
      if (el("histMore").getBoundingClientRect().top < window.innerHeight * HIST_PRELOAD_SCREENS) loadOlder();
    }
    window.addEventListener("scroll", checkMore, { passive: true });
    window.addEventListener("online", function () { setTimeout(checkMore, HIST_ONLINE_DELAY_MS); });
    function canRedrawHistory() { return !state.editing && !swipe.openRow && !swipe.row; }
    function deleteRow(i) {
      var r = state.recent[i];
      if (!r) return;
      if (navigator.onLine === false) { closeOpenRow(); toast(NO_NET_DELETE, false, TOAST_LONG_MS); return; }
      pendingDeletes++;
      // строки ниже удаляемой в таблице сдвинутся вверх на одну
      var rest = state.recent.filter(function (x, k) { return k !== i; }).map(function (x) {
        return x.row > r.row ? Object.assign({}, x, { row: x.row - 1 }) : x;
      });
      if (hist.next > r.row) hist.next--;
      swipe.openRow = null;
      swipe.row = null;
      renderHistory(rest);
      function allDone(full) {
        if (pendingDeletes > 0) return;
        if (deleteFailed) {
          deleteFailed = false;
          call("apiGetRecent", [], function (list) { if (pendingDeletes === 0 && canRedrawHistory()) renderHistory(withOlder(list)); }, function () {});
        } else if (full && full.recent && canRedrawHistory()) renderHistory(withOlder(full.recent));
      }
      call("apiDeleteTransaction", [r.row, { date: r.date, amount: r.amount, currencyId: r.currencyId, categoryId: r.categoryId, id: r.id || "" }], function (res, full) {
        pendingDeletes--;
        toast(res.message);
        allDone(full);
      }, function (msg, kind) {
        pendingDeletes--;
        if (kind === "network") toast(NO_NET_DELETE, false, TOAST_LONG_MS); else toast(msg, true);
        if (kind !== "network") deleteFailed = true; // без связи перечитать всё равно не выйдет
        var back = state.recent.concat([r]).sort(byDateDesc);
        if (canRedrawHistory()) renderHistory(back); else state.recent = back;
        allDone(null);
      });
    }

    // ---------- история ----------
    function fmtNum(n) { return isFinite(n) ? Number(n).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) : String(n); }
    // заголовок дня: слева «Сегодня» / «Вчера» / день недели, справа дата («16 ноября»; другой год — с годом)
    function dayHead(key) {
      if (!key) return '<div class="day"><span>Без даты</span></div>';
      var p = key.split("-").map(Number);
      var d = new Date(p[0], p[1] - 1, p[2]);
      var t = (state.todayKey || "").split("-").map(Number);
      var today = t.length === 3 ? new Date(t[0], t[1] - 1, t[2]) : null;
      var diff = today ? Math.round((today - d) / 86400000) : NaN;
      var left = diff === 0 ? "Сегодня" : diff === 1 ? "Вчера" : d.toLocaleDateString("ru-RU", { weekday: "long" });
      left = left.charAt(0).toUpperCase() + left.slice(1);
      var opts = { day: "numeric", month: "long" };
      if (today && p[0] !== t[0]) opts.year = "numeric";
      return '<div class="day"><span>' + esc(left) + '</span><span class="dd">' + esc(d.toLocaleDateString("ru-RU", opts)) + '</span></div>';
    }
    // траты из очереди на телефоне — отдельным блоком над историей
    function queuedHtml() {
      var l = outbox();
      if (!l.length) return "";
      return '<div class="day"><span>Ждут отправки</span></div>' + l.map(function (x) {
        var f = x.form, n = Number(f.amount);
        var t = f.at ? new Date(f.at) : null;
        var time = t && isFinite(t.getTime()) ? t.toLocaleString("ru-RU", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
        // статус: не записалась / отправляется сейчас / ждёт своей очереди (связь есть) / ждёт связи
        var status = x.error ? '<span class="q err">не записалась: ' + esc(x.error) + '</span>'
          : sendingIds.indexOf(f.id) > -1 ? '<span class="q sending"><span class="q-spin"></span>отправляется…</span>'
          : !state.offline ? '<span class="q waiting">в очереди на отправку</span>'
          : '<span class="q">ждёт связи</span>';
        return '<div class="row queued" data-q="' + esc(f.id) + '">' +
          '<button class="swipe-del" aria-label="Удалить">Удалить</button>' +
          '<div class="card tx"><div class="tx-main">' +
            '<div><span class="amount' + (n > 0 ? " pos" : "") + '">' + esc(fmtNum(n)) + " " + esc(f.currencyId) + '</span></div>' +
            '<div class="tx-sub">' + esc(categoryName(f.categoryId) || f.categoryId) + (time ? ' · ' + esc(time) : '') + '</div>' +
            '<div class="tx-sub tx-status">' + status + '</div>' +
          '</div></div></div>';
      }).join("");
    }
    function renderHistory(items) {
      swipe.openRow = null;
      if (items === null) { el("historyList").innerHTML = queuedHtml() + pendingBlock("pending tall"); el("histMore").innerHTML = ""; return; } // ещё грузится
      state.recent = items || [];
      cacheInit({ recent: state.recent.slice(0, HIST_PAGE) }); // на телефоне храним только первую страницу
      var html = queuedHtml(), lastDay = null;
      var gone = cancels();
      state.recent.forEach(function (r, i) {
        if (r.id && gone.indexOf(r.id) > -1) return; // удалена, сервер ещё не подтвердил
        if (r.dayKey !== lastDay) { html += dayHead(r.dayKey); lastDay = r.dayKey; }
        var n = Number(r.amount);
        var name = r.categoryName || categoryName(r.categoryId) || "Без категории";
        html += '<div class="row" data-i="' + i + '">' +
          '<button class="swipe-del" aria-label="Удалить">Удалить</button>' +
          '<div class="card tx">' +
          '<div class="tx-main">' +
            '<div><span class="amount' + (n > 0 ? " pos" : "") + '">' + esc(fmtNum(n)) + " " + esc(r.currencyId) + '</span>' +
            (r.amountEUR !== "" && r.currencyId !== "EUR" ? ' <span class="muted">' + esc(fmtNum(r.amountEUR)) + ' EUR</span>' : '') + '</div>' +
            '<div class="tx-sub">' + esc(name) + (r.time ? ' · ' + esc(r.time) : '') + '</div>' +
          '</div>' +
          '</div></div>';
      });
      el("historyList").innerHTML = html || '<p class="muted">Пока пусто</p>';
      renderMore();
      setTimeout(checkMore, 0);
    }

    // ---------- параметры ссылки (после "#") ----------
    // sms — текст СМС от шортката (разбираем здесь, на странице); src=clip — текст взят из буфера обмена;
    // tab=history — сразу открыть историю; t — ключ доступа, api — адрес сервера: их запоминаем на устройстве.
    // Ключ, адрес и текст СМС сразу убираем из адресной строки.
    function readParams() {
      var q = {};
      try { new URLSearchParams(location.hash.replace(/^#/, "")).forEach(function (v, k) { q[k] = v; }); } catch (e) {}
      if (q.t || q.api || q.sms) {
        if (q.t) store("token", q.t);
        if (isApiUrl(q.api)) store("api", q.api);
        if (q.sms) session("sms", q.sms);
        var rest = new URLSearchParams();
        Object.keys(q).forEach(function (k) { if (k !== "t" && k !== "api" && k !== "sms") rest.append(k, q[k]); });
        var hash = rest.toString();
        try { history.replaceState(null, "", location.pathname + location.search + (hash ? "#" + hash : "")); } catch (e) {}
        delete q.t;
        delete q.api;
      }
      // после обновления страницы текст СМС берём из вкладки
      if (!q.sms) q.sms = session("sms") || "";
      return q;
    }

    // ---------- кэш на устройстве: категории, валюты, магазины и последняя история ----------
    // Страница сразу рисуется из кэша, а свежие данные с сервера приходят фоном.
    function readCache() {
      if (!hasAccess()) return null;
      try { var c = JSON.parse(store("init") || "null"); return c && c.categories && c.currencies ? c : null; } catch (e) { return null; }
    }
    function cacheInit(part) {
      var c = readCache();
      if (!c && !part.categories) return; // нечего дополнять
      try { store("init", JSON.stringify(Object.assign(c || {}, part))); } catch (e) {}
    }

    // ---------- подстановка траты из ссылки или СМС ----------
    // Вызывается сразу при открытии и ещё раз, когда пришли справочники: до этого могут быть
    // неизвестны валюты (общий формат СМС) и категории магазинов. Ввод пользователя не перезаписываем.
    function applyPrefill() {
      if (state.editing) return;
      var q = params, p = null;
      if (state.smsText) {
        var r = parseBankText(state.smsText);
        if (r) p = { amount: r.amount, currencyId: r.currencyId, categoryId: merchantCategory(r.merchant), merchant: r.merchant };
        else if (state.loaded && !state.smsFailShown && looksLikeBankText(state.smsText)) {
          // подсказываем, только если это явно сообщение банка (например, банк поменял формат);
          // любой другой текст из буфера молча оставляет форму пустой
          state.smsFailShown = true;
          toast("Не получилось разобрать сообщение банка — введите сумму вручную", false, TOAST_LONG_MS);
        }
      }
      if (!p) return;
      if (state.touched) {
        // пользователь уже что-то менял — только подсказываем категорию, если он её ещё не выбрал
        if (!state.categoryId && p.categoryId) pickCategory(p.categoryId);
        return;
      }
      fillForm(p);
      // src=clip — шорткат взял текст из буфера обмена: после сохранения буфер очистим
      state.prefill = { merchant: p.merchant || "", fromClip: q.src === "clip" };
    }

    // ---------- загрузка ----------
    var params = readParams();
    state.smsText = params.sms || "";

    // справочники пришли (из кэша или с сервера) — обновляем, не сбивая то, что пользователь уже выбрал
    function applyData(data) {
      var cur = el("currency").value || state.wantCurrency || store("currency") || "";
      if (state.wantCurrency && !state.touched) cur = state.wantCurrency;
      state.categories = data.categories || [];
      state.currencies = data.currencies || [];
      state.merchants = data.merchants || state.merchants || {};
      state.todayKey = data.todayKey || state.todayKey || "";
      if (data.periodStartDay) state.periodStartDay = data.periodStartDay;
      if (data.serverVersion) { state.serverVersion = data.serverVersion; renderVersion(); }
      applyLimits(data.limits);
      state.loaded = true;
      state.loadError = "";
      renderCurrencies(cur);
      if (!state.categories.some(function (c) { return c.categoryId === state.categoryId; })) state.categoryId = "";
      renderCategories();
      hist.done = false; hist.next = 0; hist.failed = false;
      if (!state.editing && pendingDeletes === 0 && !swipe.openRow && !swipe.row) renderHistory(data.recent || []);
      applyPrefill();
    }

    // числа, общие с сервером (limits в ответе init): страница истории, пачка отправки, длина названия магазина
    function applyLimits(l) {
      if (!l) return;
      if (l.historyPage > 0) HIST_PAGE = l.historyPage;
      if (l.sendBatch > 0) SEND_BATCH = l.sendBatch;
      if (l.merchantMax > 0) MERCHANT_MAX = l.merchantMax;
    }

    function load() {
      if (!state.loaded) { state.loadError = ""; renderCategories(); renderHistory(null); }
      el("netRetry").disabled = true;
      call("apiGetInitData", [], function (data) {
        el("netRetry").disabled = false;
        cacheInit({ categories: data.categories, currencies: data.currencies, merchants: data.merchants || {}, recent: data.recent, todayKey: data.todayKey, periodStartDay: data.periodStartDay, limits: data.limits, serverVersion: data.serverVersion });
        applyData(data);
        flushOutbox(); // связь есть — отправляем траты, отложенные без связи
        flushCancels(); // и удаляем на сервере то, что удалили, пока оно отправлялось
      }, function (msg) {
        el("netRetry").disabled = false;
        if (state.loaded) return; // данные из кэша уже на экране; если нет связи — об этом говорит плашка
        state.loadError = msg;
        renderCategories();
        renderHistory(null);
      });
    }

    // форма показывается сразу; чего ещё нет — крутится индикатор, пока данные грузятся фоном
    function boot() {
      if (!hasAccess()) { noAccess(MSG_OPEN_VIA_SHORTCUT); return; }
      el("loader").classList.add("hidden");
      el("app").classList.remove("hidden");
      setSign(-1);
      renderCurrencies(store("currency") || "");
      if (navigator.onLine === false) setOnline(false); // телефон офлайн — говорим сразу, не дожидаясь запроса
      var cached = readCache();
      if (cached) applyData(cached);
      else { renderCategories(); renderHistory(null); applyPrefill(); } // формат банка разбирается и без справочников
      if (params.tab === "history") showTab("history");
      load();
    }

    // шорткат открыл новую ссылку на уже открытой странице — перечитываем её
    window.addEventListener("hashchange", function () { location.reload(); });

    applyTheme();
    renderVersion();
    lastSize = { w: window.innerWidth, h: window.innerHeight };
    boot();
  </script>
</body>
</html>
