<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- данные уходят только на сервер Apps Script; чужие скрипты, картинки и формы запрещены -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src https://script.google.com https://script.googleusercontent.com; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Траты">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Бюджет</title>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "dark" && t !== "light") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --field:#fff; --text:#1d1f23; --muted:#8a9099; --accent:#2563eb; --accent-soft:#e8efff; --line:#e5e7eb; --ok:#16a34a; --danger:#dc2626; --toast:#1d1f23;
      --toast-text:#fff; --shadow:rgba(0,0,0,.06); color-scheme:light; }
    html[data-theme="dark"] { --bg:#111317; --card:#1b1e24; --field:#23272e; --text:#e8eaed; --muted:#9aa0a6; --accent:#3b82f6; --accent-soft:#1e2a44; --line:#2f343c; --ok:#4ade80;
      --danger:#f87171; --toast:#e8eaed; --toast-text:#111317; --shadow:rgba(0,0,0,.4); color-scheme:dark; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html { background:var(--bg); }
    body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); font-size:16px; }
    button { font-family:inherit; cursor:pointer; }
    .wrap { max-width:480px; margin:0 auto; padding:calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom)); }
    .hidden { display:none !important; }
    .muted { color:var(--muted); font-size:13px; }
    /* загрузка */
    .loader { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:0 24px; text-align:center; background:var(--bg); z-index:10; }
    .spinner { width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* вкладки — сегмент на всю ширину */
    .tabs { display:flex; background:var(--line); border-radius:12px; padding:3px; margin-bottom:14px; }
    .tabs button { flex:1; padding:9px; border:0; background:transparent; border-radius:9px; font-size:15px; color:var(--muted); }
    .tabs button.active { background:var(--card); color:var(--text); box-shadow:0 1px 2px var(--shadow); }
    /* шапка режима изменения */
    .editbar { display:flex; align-items:center; gap:6px; margin-bottom:14px; min-height:42px; }
    .editbar .back { border:0; background:transparent; color:var(--accent); font-size:22px; padding:4px 10px 4px 2px; }
    .editbar .title { font-size:16px; font-weight:600; }
    .editbar .date { color:var(--muted); font-weight:400; }
    .card { background:var(--card); border-radius:14px; padding:14px; margin-bottom:10px; box-shadow:0 1px 2px var(--shadow); }
    /* поле суммы: знак | сумма | валюта */
    .amount-field { display:flex; align-items:stretch; border:1px solid var(--line); border-radius:12px; background:var(--field); overflow:hidden; }
    .amount-field .sign { flex:0 0 52px; border:0; border-right:1px solid var(--line); background:transparent; color:var(--text); font-size:22px; }
    .amount-field.pos .sign, .amount-field.pos input { color:var(--ok); }
    .amount-field input { flex:1; min-width:0; border:0; outline:none; background:transparent; color:var(--text); font-size:22px; padding:12px; }
    .amount-field .clear { flex:0 0 40px; border:0; background:transparent; color:var(--muted); font-size:18px; padding:0; }
    #clearAmt.hidden { display:block !important; visibility:hidden; }
    .amount-field select { flex:0 0 86px; border:0; border-left:1px solid var(--line); background:transparent; color:var(--text); font-size:16px; padding:0 10px; -webkit-appearance:none;
      appearance:none; text-align:center; }
    /* сетка категорий */
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:12px; }
    .chip { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; min-height:62px; padding:6px 4px; border:1px solid var(--line); border-radius:12px;
      background:var(--field); color:var(--text); }
    .chip .emo { font-size:20px; line-height:1; }
    .chip .name { font-size:12px; line-height:1.2; text-align:center; }
    .chip.on { border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
    .btn { width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:17px; margin-top:12px; }
    .btn:disabled { opacity:.5; }
    .link { display:block; width:100%; margin-top:6px; padding:8px; border:0; background:transparent; color:var(--muted); font-size:14px; }
    /* история */
    .day { color:var(--muted); font-size:13px; font-weight:600; margin:24px 4px 10px; }
    .day:first-child { margin-top:0; }
    /* строка истории: карточка сдвигается свайпом влево и открывает кнопку «Удалить» */
    .row { position:relative; margin-bottom:10px; border-radius:14px; overflow:hidden; }
    .row .card { margin-bottom:0; }
    .tx { position:relative; z-index:1; display:flex; align-items:center; gap:8px; padding:14px 16px; touch-action:pan-y; transition:transform .25s ease; will-change:transform; }
    .swipe-del { position:absolute; top:0; right:0; bottom:0; width:96px; padding-left:8px; border:0; background:var(--danger); color:#fff; font-size:15px; visibility:hidden; }
    .row.swiping .swipe-del { visibility:visible; }
    .row.swiping .tx { border-radius:0; }
    .tx-main { flex:1; min-width:0; }
    .tx-sub { color:var(--muted); font-size:13px; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .amount { font-weight:600; }
    .amount.pos { color:var(--ok); }
    .row.busy { pointer-events:none; }
    .row.busy .tx { opacity:.55; }
    .mini-spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.45); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;
      vertical-align:middle; }
    footer { text-align:center; margin-top:18px; }
    .footer-link { border:0; background:transparent; color:var(--muted); font-size:13px; padding:8px; }
    /* уведомление внизу, поверх содержимого */
    .toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%, -20px); max-width:calc(100% - 28px); padding:11px 16px; border-radius:12px;
      background:var(--toast); color:var(--toast-text); font-size:14px; box-shadow:0 4px 16px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; }
    .toast.show { opacity:1; transform:translate(-50%, 0); }
    .toast.err { background:var(--danger); color:#fff; }
    /* пока данные грузятся фоном — индикаторы на месте категорий, валюты и истории */
    .spinner.sm { width:22px; height:22px; border-width:2px; }
    .pending { grid-column:1/-1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:120px; text-align:center; }
    .pending.tall { min-height:160px; }
    .amount-field select.loading { color:var(--muted); }
  </style>
</head>
<body>
  <div id="loader" class="loader">
    <div class="spinner" id="spinner"></div>
    <div id="loaderText" class="muted"></div>
    <button id="retryBtn" class="link hidden" style="width:auto" onclick="load()">Повторить</button>
  </div>

  <div id="app" class="wrap hidden">
    <nav id="tabs" class="tabs">
      <button id="tab-add" class="active" onclick="showTab('add')">Ввод</button>
      <button id="tab-history" onclick="showTab('history')">История</button>
    </nav>
    <div id="editBar" class="editbar hidden">
      <button class="back" onclick="cancelEdit()" aria-label="Назад">←</button>
      <span class="title">Изменение траты <span id="editDate" class="date"></span></span>
    </div>

    <section id="view-add">
      <div class="card">
        <div id="amountField" class="amount-field">
          <button id="signBtn" class="sign" onclick="toggleSign()" aria-label="Сменить знак">−</button>
          <input id="amount" inputmode="decimal" placeholder="0" autocomplete="off">
          <button id="clearAmt" class="clear hidden" onclick="clearAmount()" aria-label="Стереть сумму">✕</button>
          <select id="currency" aria-label="Валюта"></select>
        </div>
        <div id="catGrid" class="grid"></div>
        <button class="btn" id="saveBtn" onclick="save()">Сохранить</button>
      </div>
    </section>

    <section id="view-history" class="hidden">
      <div id="historyList"></div>
    </section>

    <footer><button id="themeBtn" class="footer-link" onclick="toggleTheme()"></button></footer>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // prefill — данные траты из ссылки шортката, СМС или вставленного текста: { merchant }
    // pendingId — id новой траты, пока она не сохранена: повторная отправка после обрыва связи не создаст дубль
    // loaded — справочники (категории, валюты, магазины) уже есть: из кэша на устройстве или с сервера
    // touched — пользователь сам менял форму: фоновая загрузка больше не перезаписывает его ввод
    var state = { categories: [], currencies: [], merchants: {}, recent: [], prefill: null, editing: null, savedNew: null, deleting: -1, sign: -1, categoryId: "", todayKey: "",
      pendingId: null, loaded: false, loadError: "", touched: false, smsText: "", smsFailShown: false };

    function el(id) { return document.getElementById(id); }
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
    function store(key, value) {
      try {
        if (value === undefined) return localStorage.getItem(key);
        if (value === null) localStorage.removeItem(key); else localStorage.setItem(key, value);
      } catch (e) { return null; }
    }
    // текст СМС на время жизни вкладки: обновление страницы не теряет подставленную трату
    function session(key, value) {
      try {
        if (value === undefined) return sessionStorage.getItem(key);
        if (value === null) sessionStorage.removeItem(key); else sessionStorage.setItem(key, value);
      } catch (e) { return null; }
    }

    // ---------- уведомление ----------
    // isError — красное уведомление (ошибка); ms — сколько показывать, если нужно дольше обычного
    function toast(text, isError, ms) {
      var t = el("toast");
      t.textContent = text;
      t.className = "toast show" + (isError ? " err" : "");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(function () { t.className = "toast" + (isError ? " err" : ""); }, ms || (isError ? 5000 : 2500));
    }

    // любое касание страницы или нажатие клавиши убирает уведомление: пользователь уже приступил к делу.
    // Новое уведомление от этого же касания (например, ошибка при сохранении) появится уже после.
    function hideToast() {
      clearTimeout(toast.timer);
      el("toast").classList.remove("show");
    }
    document.addEventListener("pointerdown", hideToast, true);
    document.addEventListener("keydown", hideToast, true);

    function setSaving(on) {
      var b = el("saveBtn");
      b.disabled = on;
      b.innerHTML = on ? '<span class="mini-spinner"></span>' : "Сохранить";
    }

    // ---------- связь с сервером (Apps Script) ----------
    // Адрес сервера и ключ приходят в ссылке от шортката (после "#") и хранятся только на этом устройстве.
    var API = {
      apiGetInitData: function () { return { fn: "init" }; },
      apiGetRecent: function () { return { fn: "recent" }; },
      apiAddTransaction: function (form) { return { fn: "add", form: form }; },
      apiUpdateTransaction: function (row, expected, form) { return { fn: "update", row: row, expected: expected, form: form }; },
      apiDeleteTransaction: function (row, expected) { return { fn: "delete", row: row, expected: expected }; }
    };

    function isApiUrl(u) { return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(String(u || "")); }
    function hasAccess() { return isApiUrl(store("api")) && !!store("token"); }

    var TIMEOUT_MS = 30000; // дольше ответа не ждём: на плохой связи иначе индикатор крутится бесконечно

    function call(fn, args, onOk, onErr) {
      function fail(msg) {
        if (onErr) onErr(msg); else toast(msg, true);
        setSaving(false);
      }
      var api = store("api"), token = store("token");
      if (!isApiUrl(api) || !token) { noAccess("Откройте форму через шорткат «Бюджет»"); return; }
      var body = API[fn].apply(null, args || []);
      body.action = "page";
      body.token = token;
      var ctrl = typeof AbortController === "function" ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, TIMEOUT_MS) : null;
      // text/plain — «простой» запрос без предварительной проверки CORS, Apps Script его принимает
      fetch(api, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), redirect: "follow", credentials: "omit", referrerPolicy: "no-referrer", signal: ctrl ? ctrl.signal : undefined })
        .then(function (r) {
          // Google при сбое (квота, ошибка скрипта) отвечает HTML-страницей, а не JSON
          return r.text().then(function (text) {
            try { return JSON.parse(text); } catch (e) { throw { server: "Сервер ответил ошибкой" + (r.status !== 200 ? " (HTTP " + r.status + ")" : "") + " — попробуйте позже" }; }
          });
        })
        .then(function (res) {
          clearTimeout(timer);
          if (res && res.ok) { onOk(res.result, res); return; }
          if (res && res.auth === false) {
            store("token", null); // ключ не подошёл — забываем его и кэш данных
            store("init", null);
            noAccess("Нет доступа. Откройте форму через шорткат «Бюджет»");
            return;
          }
          fail((res && res.error) || "Ошибка сервера");
        })
        .catch(function (e) {
          clearTimeout(timer);
          if (e && e.server) fail(e.server);
          else if (e && e.name === "AbortError") fail("Сервер не ответил — попробуйте ещё раз");
          else fail("Нет связи с сервером");
        });
    }

    // случайный id новой траты
    function newId() {
      try { if (window.crypto && crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
      return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);
    }
    // форму поменяли — это уже другая трата, нужен новый id; byUser — изменил сам пользователь
    function formChanged(byUser) {
      state.pendingId = null;
      if (byUser) state.touched = true;
    }

    function noAccess(text) {
      el("app").classList.add("hidden");
      el("loader").classList.remove("hidden");
      el("spinner").classList.add("hidden");
      el("retryBtn").classList.add("hidden");
      el("loaderText").textContent = text;
    }

    // ---------- разбор СМС / уведомления банка ----------
    // Те же правила, что и на сервере (parseBankText_ в Code.gs): при изменении — менять в обоих местах.

    // число из строки: "1 234,50", "1.234,50", "1,234.50", "-350" и т.п.
    function parseNumber(raw) {
      var s = String(raw).replace(/[\s  ']/g, "");
      var lastDot = s.lastIndexOf("."), lastComma = s.lastIndexOf(",");
      if (lastDot > -1 && lastComma > -1) {
        if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
        else s = s.replace(/,/g, "");
      } else if (lastComma > -1) {
        var commas = (s.match(/,/g) || []).length;
        if (commas > 1 || s.length - lastComma - 1 === 3) s = s.replace(/,/g, "");
        else s = s.replace(",", ".");
      } else if (lastDot > -1) {
        var dots = (s.match(/\./g) || []).length;
        if (dots > 1 || s.length - lastDot - 1 === 3) s = s.replace(/\./g, "");
      }
      return Number(s);
    }

    function normalizeMerchant(name) {
      return String(name || "").replace(/\s+/g, " ").trim().replace(/^[=+\-@'\s]+/, "").slice(0, 100).toUpperCase();
    }

    // категория, которую магазин получил в прошлый раз (только подсказка)
    function merchantCategory(merchant) {
      var key = normalizeMerchant(merchant);
      return key && Object.prototype.hasOwnProperty.call(state.merchants, key) ? String(state.merchants[key]) : "";
    }

    function extractMerchant(t, amountText) {
      var patterns = [
        /(?:trgovac|prodajno mesto|mesto|kod|merchant|магазин|место)\s*[:\-]?\s*([^\n,;]{2,60})/i,
        /\b(?:at|u|в)\s+([A-ZА-ЯЁ0-9][^\n,;]{1,60})/
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = t.match(patterns[i]);
        if (m && m[1] && m[1].indexOf(amountText) === -1) return normalizeMerchant(m[1]);
      }
      return "";
    }

    // { amount, currencyId, merchant } или null. Формат банка разбирается сразу,
    // общий формат («500 RSD …») — только когда известен список валют.
    function parseBankText(text) {
      var t = String(text || "").replace(/ /g, " ");

      // Placeno kart.br. 535174_2257 / MP341 HIPER MC BG / ovi Beograd RS / RSD 2,524.97 / Raspolozivo: RSD 34,718.68
      var parts = t.split("/").map(function (s) { return s.trim(); }).filter(Boolean);
      if (/^plac[ae]no\b/i.test(parts[0] || "") && parts.length >= 4) {
        for (var i = 2; i < parts.length; i++) {
          if (/^raspolo/i.test(parts[i])) break;
          var am = parts[i].match(/^([A-Za-z]{3})\s*([\d.,\s]+)$/) || parts[i].match(/^([\d.,\s]+)\s*([A-Za-z]{3})$/);
          if (!am) continue;
          var codeFirst = /^[A-Za-z]/.test(am[1]);
          var value = parseNumber(codeFirst ? am[2] : am[1]);
          if (isFinite(value) && value !== 0)
            return { amount: -Math.abs(value), currencyId: (codeFirst ? am[1] : am[2]).toUpperCase(), merchant: normalizeMerchant(parts[1]) };
        }
      }
      var codes = state.currencies.map(function (c) { return String(c).replace(/[^A-Za-z]/g, ""); }).filter(Boolean);
      if (!codes.length) return null;
      var codeRe = codes.join("|");
      var num = "(\\d{1,3}(?:[ .,']\\d{3})+(?:[.,]\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)";

      var amountStr = "", currencyId = "", matched = "";
      // перед суммой — начало строки или не цифра (вместо lookbehind, которого нет в старом Safari)
      var m = t.match(new RegExp("(?:^|[^\\d.,])" + num + "\\s*(" + codeRe + ")\\b", "i"));
      if (m) { amountStr = m[1]; currencyId = m[2]; matched = m[0]; }
      else {
        m = t.match(new RegExp("\\b(" + codeRe + ")\\s*" + num, "i"));
        if (m) { currencyId = m[1]; amountStr = m[2]; matched = m[0]; }
      }
      if (!m) return null;

      var amount = Math.abs(parseNumber(amountStr));
      if (!isFinite(amount) || amount === 0) return null;
      // поступления — со знаком плюс, всё остальное — расход
      if (!/(uplat|priliv|odobren|povra[ćt]|refund|\bcredited\b|зачисл|пополн|возврат|поступ)/i.test(t)) amount = -amount;
      return { amount: amount, currencyId: currencyId.toUpperCase(), merchant: extractMerchant(t, matched.trim()) };
    }

    // ---------- тема ----------
    function currentTheme() { return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
    function updateThemeBtn() { el("themeBtn").textContent = currentTheme() === "dark" ? "☾ Тёмная тема" : "☀︎ Светлая тема"; }
    function toggleTheme() {
      var t = currentTheme() === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
      store("theme", t); // запоминаем на этом устройстве
      updateThemeBtn();
    }

    // ---------- вкладки ----------
    function showTab(name) {
      if (state.editing && name === "add") return;
      ["add", "history"].forEach(function (t) {
        el("view-" + t).classList.toggle("hidden", t !== name);
        el("tab-" + t).classList.toggle("active", t === name);
      });
    }

    // ---------- знак ----------
    function setSign(s) {
      state.sign = s;
      el("signBtn").textContent = s < 0 ? "−" : "+";
      el("amountField").classList.toggle("pos", s > 0);
    }
    function toggleSign() { setSign(-state.sign); formChanged(true); }

    // ---------- индикаторы загрузки ----------
    // пока справочников нет: в сетке категорий — индикатор или ошибка с кнопкой «Повторить»
    function pendingBlock(cls) {
      if (state.loadError) return '<div class="' + cls + '"><span class="muted">' + esc(state.loadError) + '</span><button class="link" style="width:auto;margin:0" onclick="load()">Повторить</button></div>';
      return '<div class="' + cls + '"><span class="spinner sm"></span></div>';
    }

    // ---------- категории ----------
    function splitName(name) {
      var m = String(name || "").match(/^(\S+)\s+(.+)$/);
      if (m && !/[A-Za-zА-Яа-яЁё0-9]/.test(m[1])) return { emo: m[1], label: m[2] };
      return { emo: "", label: String(name || "") };
    }
    function renderCategories() {
      if (!state.loaded) { el("catGrid").innerHTML = pendingBlock("pending"); return; }
      el("catGrid").innerHTML = state.categories.map(function (c, i) {
        var n = splitName(c.categoryName);
        return '<button class="chip' + (c.categoryId === state.categoryId ? " on" : "") + '" onclick="userPickCategory(' + i + ')">' +
          (n.emo ? '<span class="emo">' + esc(n.emo) + '</span>' : '') +
          '<span class="name">' + esc(n.label) + '</span></button>';
      }).join("");
    }
    function pickCategory(id) { state.categoryId = id; renderCategories(); }
    function userPickCategory(i) { var c = state.categories[i]; if (!c) return; pickCategory(c.categoryId); formChanged(true); }
    function categoryName(id) {
      var c = state.categories.filter(function (x) { return x.categoryId === id; })[0];
      return c ? c.categoryName : "";
    }
    // список валют; пока его нет — «…» и выбор недоступен
    function renderCurrencies(selected) {
      var sel = el("currency");
      if (!state.currencies.length) { sel.innerHTML = '<option value="">…</option>'; sel.disabled = true; sel.classList.add("loading"); return; }
      if (state.currencies.indexOf(selected) < 0) selected = state.currencies.indexOf("RSD") > -1 ? "RSD" : state.currencies[0];
      sel.innerHTML = state.currencies.map(function (c) {
        return '<option value="' + esc(c) + '"' + (c === selected ? " selected" : "") + ">" + esc(c) + "</option>";
      }).join("");
      sel.disabled = false;
      sel.classList.remove("loading");
    }

    // ---------- форма ----------
    function fillForm(d) {
      formChanged();
      setSign(Number(d.amount) > 0 ? 1 : -1);
      el("amount").value = Math.abs(Number(d.amount)) || "";
      updateClear();
      if (d.currencyId) state.wantCurrency = d.currencyId; // если валют ещё нет — выберем, когда загрузятся
      if (state.currencies.indexOf(d.currencyId) > -1) el("currency").value = d.currencyId;
      pickCategory(d.categoryId || "");
    }
    function resetForm() {
      setSign(-1);
      el("amount").value = "";
      updateClear();
      pickCategory("");
      state.prefill = null;
      state.wantCurrency = "";
      formChanged();
      state.touched = false;
    }
    // убрать данные траты из адресной строки и из вкладки, чтобы обновление страницы не подставило их снова
    function clearUrl() {
      try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
      state.smsText = "";
      session("sms", null);
    }

    // крестик в поле суммы: стирает только сумму
    function updateClear() { el("clearAmt").classList.toggle("hidden", !el("amount").value); }
    function clearAmount() {
      el("amount").value = "";
      updateClear();
      formChanged(true);
      el("amount").focus();
    }
    el("amount").addEventListener("input", function () { updateClear(); formChanged(true); });
    el("currency").addEventListener("change", function () { state.wantCurrency = ""; formChanged(true); });

    // вставка текста банка в поле суммы — разбираем прямо на странице и заполняем форму
    el("amount").addEventListener("paste", function (e) {
      if (state.editing) return;
      var text = (e.clipboardData || window.clipboardData).getData("text") || "";
      if (/^\s*[-+]?[\d\s.,]+\s*$/.test(text)) return; // обычное число — вставляем как есть
      e.preventDefault();
      var r = parseBankText(text);
      if (!r) { toast(state.loaded ? "В тексте нет суммы с валютой — введите вручную" : "Справочники ещё загружаются — попробуйте через пару секунд", false, 4000); return; }
      fillForm({ amount: r.amount, currencyId: r.currencyId, categoryId: merchantCategory(r.merchant) });
      state.prefill = { merchant: r.merchant || "" };
      state.touched = true;
    });

    function readForm() {
      var raw = el("amount").value.trim().replace(/\s/g, "").replace(",", ".").replace(/^[-+]/, "");
      var amount = Number(raw);
      if (!raw || !isFinite(amount) || amount === 0) { toast("Введите сумму", true); el("amount").focus(); return null; }
      if (!state.loaded) { toast("Справочники ещё загружаются — подождите пару секунд", true); return null; }
      if (!state.categoryId) { toast("Выберите категорию", true); return null; }
      return { amount: state.sign * Math.abs(amount), currencyId: el("currency").value, categoryId: state.categoryId };
    }

    function save() {
      var form = readForm();
      if (!form) return;
      setSaving(true);
      if (state.editing) {
        var ed = state.editing;
        call("apiUpdateTransaction", [ed.row, ed.expected, form], function (res, full) {
          setSaving(false);
          toast(res.message);
          cancelEdit();
          showRecent(full);
        });
        return;
      }
      var p = state.prefill || {};
      form.merchant = p.merchant || "";
      // тот же id при повторном нажатии после обрыва связи — сервер не запишет трату второй раз
      if (!state.pendingId) state.pendingId = newId();
      form.id = state.pendingId;
      call("apiAddTransaction", [form], function (res, full) {
        setSaving(false);
        store("currency", form.currencyId);
        resetForm();
        clearUrl();
        toast(res.message);
        showRecent(full);
      });
    }
    // сервер присылает свежую историю вместе с ответом; если её нет — запрашиваем отдельно
    function showRecent(full) {
      if (full && full.recent) renderHistory(full.recent);
      else call("apiGetRecent", [], renderHistory);
    }

    // ---------- изменение ----------
    function startEdit(i) {
      if (state.deleting > -1) return;
      var r = state.recent[i];
      if (!r) return;
      state.savedNew = { amount: el("amount").value, sign: state.sign, categoryId: state.categoryId, currencyId: el("currency").value, prefill: state.prefill, pendingId: state.pendingId, touched: state.touched };
      state.editing = { row: r.row, expected: { date: r.date, amount: r.amount, currencyId: r.currencyId } };
      state.prefill = null;
      fillForm({ amount: r.amount, currencyId: r.currencyId, categoryId: r.categoryId });
      el("editDate").textContent = "· " + (r.dateLabel || "");
      el("tabs").classList.add("hidden");
      el("editBar").classList.remove("hidden");
      el("view-history").classList.add("hidden");
      el("view-add").classList.remove("hidden");
      window.scrollTo(0, 0);
    }
    function cancelEdit() {
      state.editing = null;
      el("editBar").classList.add("hidden");
      el("tabs").classList.remove("hidden");
      // возвращаем то, что было на «Вводе» до изменения
      var s = state.savedNew;
      if (s) {
        setSign(s.sign); el("amount").value = s.amount; updateClear(); el("currency").value = s.currencyId; pickCategory(s.categoryId);
        state.prefill = s.prefill;
        state.pendingId = s.pendingId;
        state.touched = s.touched;
        state.savedNew = null;
      } else resetForm();
      showTab("history");
    }

    // ---------- удаление: свайп влево открывает кнопку «Удалить» ----------
    var REVEAL = 88; // на сколько уезжает карточка
    var swipe = { row: null, startX: 0, startY: 0, base: 0, x: 0, active: false, moved: false, openRow: null, swallow: false };
    function setX(row, x, animate) {
      var c = row.querySelector(".tx");
      c.style.transition = animate ? "" : "none";
      c.style.transform = x ? "translateX(" + x + "px)" : "";
      if (x < 0) row.classList.add("swiping");
      else if (animate) setTimeout(function () { if (!c.style.transform) row.classList.remove("swiping"); }, 250);
      else row.classList.remove("swiping");
    }
    function closeOpenRow() { if (swipe.openRow) { setX(swipe.openRow, 0, true); swipe.openRow = null; } }
    // касание вне открытой строки только закрывает её
    document.addEventListener("pointerdown", function (e) {
      swipe.swallow = false;
      if (swipe.openRow && !swipe.openRow.contains(e.target)) { closeOpenRow(); swipe.swallow = true; }
    }, true);
    var list = el("historyList");
    list.addEventListener("pointerdown", function (e) {
      var row = e.target.closest(".row");
      swipe.moved = false;
      if (!row || state.deleting > -1 || e.target.closest(".swipe-del")) return;
      swipe.row = row; swipe.startX = e.clientX; swipe.startY = e.clientY;
      swipe.base = row === swipe.openRow ? -REVEAL : 0; swipe.x = swipe.base; swipe.active = false;
    });
    list.addEventListener("pointermove", function (e) {
      if (!swipe.row) return;
      var dx = e.clientX - swipe.startX, dy = e.clientY - swipe.startY;
      if (!swipe.active) {
        if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
        if (Math.abs(dy) >= Math.abs(dx)) { swipe.row = null; return; } // вертикально — это прокрутка
        swipe.active = true; swipe.moved = true;
        if (swipe.openRow && swipe.openRow !== swipe.row) closeOpenRow();
        try { swipe.row.setPointerCapture(e.pointerId); } catch (x) {}
      }
      var x = Math.min(0, swipe.base + dx);
      if (x < -REVEAL) x = -REVEAL + (x + REVEAL) / 3; // дальше кнопки — с сопротивлением
      swipe.x = x;
      setX(swipe.row, x, false);
    });
    function endSwipe() {
      var row = swipe.row;
      swipe.row = null;
      if (!row || !swipe.active) return;
      var open = swipe.x < -REVEAL / 2;
      setX(row, open ? -REVEAL : 0, true);
      swipe.openRow = open ? row : null;
    }
    list.addEventListener("pointerup", endSwipe);
    list.addEventListener("pointercancel", endSwipe);
    list.addEventListener("click", function (e) {
      if (swipe.moved || swipe.swallow) { swipe.moved = false; swipe.swallow = false; return; }
      var row = e.target.closest(".row");
      if (!row) return;
      var i = Number(row.getAttribute("data-i"));
      if (e.target.closest(".swipe-del")) { deleteRow(i); return; }
      if (swipe.openRow) { closeOpenRow(); return; }
      startEdit(i);
    });
    // карточка исчезает сразу, запрос уходит фоном; при ошибке список возвращается как был
    function deleteRow(i) {
      if (state.deleting > -1) { toast("Подождите, удаляю предыдущую"); return; }
      var r = state.recent[i];
      if (!r) return;
      var before = state.recent.slice();
      state.deleting = 1;
      // строки ниже удаляемой в таблице сдвинутся вверх на одну
      var rest = before.filter(function (x, k) { return k !== i; }).map(function (x) {
        return x.row > r.row ? Object.assign({}, x, { row: x.row - 1 }) : x;
      });
      renderHistory(rest);
      call("apiDeleteTransaction", [r.row, { date: r.date, amount: r.amount, currencyId: r.currencyId }], function (res, full) {
        state.deleting = -1;
        toast(res.message);
        if (full && full.recent && !state.editing && !swipe.openRow && !swipe.row) renderHistory(full.recent);
      }, function (msg) {
        state.deleting = -1;
        toast(msg, true);
        renderHistory(before);
      });
    }

    // ---------- история ----------
    function fmtNum(n) { return isFinite(n) ? Number(n).toLocaleString("ru-RU", { maximumFractionDigits: 2 }) : String(n); }
    function dayTitle(key) {
      if (!key) return "Без даты";
      if (key === state.todayKey) return "Сегодня";
      var p = key.split("-").map(Number);
      var d = new Date(p[0], p[1] - 1, p[2]);
      var t = state.todayKey.split("-").map(Number);
      var today = new Date(t[0], t[1] - 1, t[2]);
      var diff = Math.round((today - d) / 86400000);
      if (diff === 1) return "Вчера";
      var opts = { day: "numeric", month: "long" };
      if (p[0] !== t[0]) opts.year = "numeric";
      return d.toLocaleDateString("ru-RU", opts);
    }
    function renderHistory(items) {
      if (items === null) { el("historyList").innerHTML = pendingBlock("pending tall"); return; } // ещё грузится
      state.recent = items || [];
      swipe.openRow = null;
      cacheInit({ recent: state.recent });
      var html = "", lastDay = null;
      state.recent.forEach(function (r, i) {
        if (r.dayKey !== lastDay) { html += '<div class="day">' + esc(dayTitle(r.dayKey)) + '</div>'; lastDay = r.dayKey; }
        var n = Number(r.amount);
        var name = r.categoryName || categoryName(r.categoryId) || "Без категории";
        html += '<div class="row" data-i="' + i + '">' +
          '<button class="swipe-del" aria-label="Удалить">Удалить</button>' +
          '<div class="card tx">' +
          '<div class="tx-main">' +
            '<div><span class="amount' + (n > 0 ? " pos" : "") + '">' + esc(fmtNum(n)) + " " + esc(r.currencyId) + '</span>' +
            (r.amountEUR !== "" && r.currencyId !== "EUR" ? ' <span class="muted">≈ ' + esc(fmtNum(r.amountEUR)) + ' EUR</span>' : '') + '</div>' +
            '<div class="tx-sub">' + esc(name) + (r.time ? ' · ' + esc(r.time) : '') + '</div>' +
          '</div>' +
          '</div></div>';
      });
      el("historyList").innerHTML = html || '<p class="muted">Пока пусто</p>';
    }

    // ---------- параметры ссылки (после "#") ----------
    // sms — текст СМС от шортката (разбираем здесь, на странице);
    // amt — сумма, cur — валюта, shop — магазин, cat — категория (старый формат ссылки от сервера), tab=history,
    // t — ключ доступа, api — адрес сервера: их запоминаем на устройстве.
    // Ключ, адрес и текст СМС сразу убираем из адресной строки.
    function readParams() {
      var q = {};
      try { new URLSearchParams(location.hash.replace(/^#/, "")).forEach(function (v, k) { q[k] = v; }); } catch (e) {}
      if (q.t || q.api || q.sms) {
        if (q.t) store("token", q.t);
        if (isApiUrl(q.api)) store("api", q.api);
        if (q.sms) session("sms", q.sms);
        var rest = new URLSearchParams();
        Object.keys(q).forEach(function (k) { if (k !== "t" && k !== "api" && k !== "sms") rest.append(k, q[k]); });
        var hash = rest.toString();
        try { history.replaceState(null, "", location.pathname + location.search + (hash ? "#" + hash : "")); } catch (e) {}
        delete q.t;
        delete q.api;
      }
      // после обновления страницы текст СМС берём из вкладки
      if (!q.sms && !q.amt) q.sms = session("sms") || "";
      return q;
    }

    // ---------- кэш на устройстве: категории, валюты, магазины и последняя история ----------
    // Страница сразу рисуется из кэша, а свежие данные с сервера приходят фоном.
    function readCache() {
      if (!hasAccess()) return null;
      try { var c = JSON.parse(store("init") || "null"); return c && c.categories && c.currencies ? c : null; } catch (e) { return null; }
    }
    function cacheInit(part) {
      var c = readCache();
      if (!c && !part.categories) return; // нечего дополнять
      try { store("init", JSON.stringify(Object.assign(c || {}, part))); } catch (e) {}
    }

    // ---------- подстановка траты из ссылки или СМС ----------
    // Вызывается сразу при открытии и ещё раз, когда пришли справочники: до этого могут быть
    // неизвестны валюты (общий формат СМС) и категории магазинов. Ввод пользователя не перезаписываем.
    function applyPrefill() {
      if (state.editing) return;
      var q = params, p = null;
      if (q.amt) p = { amount: q.amt, currencyId: q.cur, categoryId: q.cat || "", merchant: q.shop || "" };
      else if (state.smsText) {
        var r = parseBankText(state.smsText);
        if (r) p = { amount: r.amount, currencyId: r.currencyId, categoryId: merchantCategory(r.merchant), merchant: r.merchant };
        else if (state.loaded && !state.smsFailShown) { state.smsFailShown = true; toast("В тексте нет суммы с валютой — введите вручную", false, 4000); } // текст мог прийти не из СМС, а из буфера — без красного и без слова «СМС»
      }
      if (!p) return;
      if (state.touched) {
        // пользователь уже что-то менял — только подсказываем категорию, если он её ещё не выбрал
        if (!state.categoryId && p.categoryId) pickCategory(p.categoryId);
        return;
      }
      fillForm(p);
      state.prefill = { merchant: p.merchant || "" };
    }

    // ---------- загрузка ----------
    var params = readParams();
    state.smsText = params.sms || "";

    // справочники пришли (из кэша или с сервера) — обновляем, не сбивая то, что пользователь уже выбрал
    function applyData(data) {
      var cur = el("currency").value || state.wantCurrency || store("currency") || "";
      if (state.wantCurrency && !state.touched) cur = state.wantCurrency;
      state.categories = data.categories || [];
      state.currencies = data.currencies || [];
      state.merchants = data.merchants || state.merchants || {};
      state.todayKey = data.todayKey || state.todayKey || "";
      state.loaded = true;
      state.loadError = "";
      renderCurrencies(cur);
      if (!state.categories.some(function (c) { return c.categoryId === state.categoryId; })) state.categoryId = "";
      renderCategories();
      if (!state.editing && state.deleting < 0 && !swipe.openRow && !swipe.row) renderHistory(data.recent || []);
      applyPrefill();
    }

    function load() {
      if (!state.loaded) { state.loadError = ""; renderCategories(); renderHistory(null); }
      call("apiGetInitData", [], function (data) {
        cacheInit({ categories: data.categories, currencies: data.currencies, merchants: data.merchants || {}, recent: data.recent, todayKey: data.todayKey });
        applyData(data);
      }, function (msg) {
        if (state.loaded) return; // уже показали из кэша — ошибку увидят при сохранении
        state.loadError = msg;
        renderCategories();
        renderHistory(null);
      });
    }

    // форма показывается сразу; чего ещё нет — крутится индикатор, пока данные грузятся фоном
    function boot() {
      if (!hasAccess()) { noAccess("Откройте форму через шорткат «Бюджет»"); return; }
      el("loader").classList.add("hidden");
      el("app").classList.remove("hidden");
      setSign(-1);
      renderCurrencies(store("currency") || "");
      var cached = readCache();
      if (cached) applyData(cached);
      else { renderCategories(); renderHistory(null); applyPrefill(); } // формат банка разбирается и без справочников
      if (params.tab === "history") showTab("history");
      load();
    }

    // шорткат открыл новую ссылку на уже открытой странице — перечитываем её
    window.addEventListener("hashchange", function () { location.reload(); });

    updateThemeBtn();
    boot();
  </script>
</body>
</html>
