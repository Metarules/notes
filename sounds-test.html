<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; form-action 'none'; base-uri 'none'; object-src 'none'">
<title>Проверка звуков</title>
<!-- Временная страница: выбрать звуки для «Сохранить» и «Удалить». Ключа и данных здесь нет. -->
<style>
body { margin:0; padding:24px 16px 80px; font-family:ui-rounded, -apple-system, system-ui, sans-serif; background:#f6f7f9; color:#1d1f23; }
h1 { font-size:20px; margin:0 0 6px; } h2 { font-size:17px; margin:22px 0 10px; }
p { margin:0 0 14px; color:#4b5563; font-size:15px; line-height:1.4; }
.case { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 2px rgba(0,0,0,.06); }
button { display:flex; justify-content:space-between; align-items:center; width:100%; padding:14px; margin-bottom:8px; border:0; border-radius:12px; background:#2563eb; color:#fff; font:inherit; font-size:17px; text-align:left; }
button:last-child { margin-bottom:0; } button.del { background:#dc2626; }
button span { opacity:.75; font-size:14px; }
input[type=range] { width:100%; }
.vol { display:flex; justify-content:space-between; font-size:15px; margin-bottom:6px; }
</style>
</head>
<body>
<h1>Проверка звуков</h1>
<p>Перед проверкой выключите Silent mode (переключатель или кнопка Action сбоку), иначе звуков не будет — так и задумано. Можно включить музыку: она не должна вставать на паузу.</p>

<div class="case">
<div class="vol"><b>Громкость</b><span id="volVal"></span></div>
<input type="range" id="vol" min="5" max="100" step="5" value="40" aria-label="Громкость">
</div>

<h2>Выбран для «Сохранить»</h2>
<div class="case">
<button data-s="save">Касса, живой звонок <span>для сравнения</span></button>
</div>

<h2>Для «Удалить» — смахивание</h2>
<div class="case">
<button class="del" data-s="soft">A. Мягкий взмах <span>пролетел мимо</span></button>
<button class="del" data-s="quick">B. Быстрый взмах <span>лёгкий</span></button>
<button class="del" data-s="down">C. Смахнуть вниз <span>высота вниз</span></button>
<button class="del" data-s="sheet">D. Листок соскользнул <span>с шорохом бумаги</span></button>
<button class="del" data-s="air">E. Воздушный «фух» <span>низкий</span></button>
<button class="del" data-s="cloth">F. Как ткань <span>с дрожанием</span></button>
<button class="del" data-s="double">G. Двойной «вжух» <span>коротко</span></button>
</div>

<p id="log"></p>
<script src="sounds-test.js?v=4"></script>
</body>
</html>
